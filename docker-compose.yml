name: qazcargo-labs
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LAB_DATABASE_PATH: /data/database.db
      LAB_SEED_DEMO: "1"
    volumes:
      - lab_data:/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_API_URL: http://localhost:8000/docs
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  lab_data:
