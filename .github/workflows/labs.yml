name: QazCargo labs tests and Docker
on:
  push:
    branches: [main, 'codex/labs-5-7', 'codex/lab-8']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: qazcargo-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lab*.txt
      - name: Install lab test dependencies
        run: python -m pip install -r requirements-lab-test.txt
      - name: API and Streamlit regression tests
        run: python -m pytest -q --junitxml=qa/pytest.xml
      - name: Static security check of the lab module
        run: |
          python -m pip install bandit==1.9.4
          python -m bandit -r labs/lab_1_2 -x labs/lab_1_2/test_lab.py,labs/lab_1_2/test_crud.py -f json -o qa/bandit.json
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start both containers
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify container networking
        run: |
          docker compose exec -T frontend python -c "import requests; r=requests.get('http://backend:8000/health',timeout=5); r.raise_for_status(); assert r.json()['status']=='ok'; print('Service DNS and HTTP: PASS')"
      - name: Exercise API and save a persistence marker
        run: python tools/check_lab_http.py create --state qa/persistence.json
      - name: Lab 8 real HTTP integration matrix
        run: python tools/check_lab8_http.py --output qa/lab8-http.json
      - name: Recreate containers while preserving the volume
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 180
      - name: Verify persistent data and clean the marker
        run: python tools/check_lab_http.py verify --state qa/persistence.json
      - name: Save container diagnostics
        if: always()
        run: |
          mkdir -p qa
          docker compose ps -a > qa/compose-status.txt
          docker compose logs --no-color > qa/compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-verification
          path: |
            qa/pytest.xml
            qa/bandit.json
            qa/lab8-http.json
            qa/compose-status.txt
            qa/compose-logs.txt
      - name: Remove the disposable CI stack
        if: always()
        run: docker compose down -v
